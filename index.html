<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joyeux Anniversaire 🎉</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffe29f, #ffa99f, #ff719a);
        color: #2d1b2f;
      }

      main {
        width: min(90vw, 680px);
        padding: 2rem;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 10px 30px rgba(45, 27, 47, 0.2);
        text-align: center;
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      p {
        font-size: 1.1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Joyeux anniversaire ! 🎂</h1>
      <p>
        Que cette journée soit remplie de joie, de rires et de beaux souvenirs.
        Profite à fond de ta fête&nbsp;!
      </p>
      <p>Avec toute mon affection 💖</p>
    </main>
  </body>
</html>
